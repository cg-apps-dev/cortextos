# gitleaks config for the backup pre-push guard (security-agent).
# Inherits default rules, then allowlists known false positives so the guard
# only aborts on REAL secrets.
[extend]
useDefault = true

[[allowlists]]
description = "Known-benign test fixtures (not real secrets)"
paths = [
  '''tests/unit/pty/output-buffer\.test\.ts''',   # FAKE_JWT synthetic test fixture
]
regexes = [
  # YouTube innertube public API key — widely-known, unauthenticated, ships in youtube-dl forks.
  # Allowlisted in gitleaks-fleet.toml too; mirrored here so the backup gate matches the fleet gate
  # and does not false-positive on the staged copy of gitleaks-fleet.toml. Public, NOT a CG secret.
  '''AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8''',
]

# generic-api-key entropy FALSE POSITIVES in FIRST-PARTY agent PROSE docs (agent memory journals
# + claude-dev video-tracker staging docs). The default generic-api-key rule misreads high-entropy
# prose as keys: Google Drive file IDs (33-char [A-Za-z0-9_-], e.g. "1Mn0pVfD..2ZN9") in tracker
# tables, and assignment-like decision prose in memory ("MECHANISM=risk"). This class BLOCKED the
# agent-state backup gate 2026-06-26..29 (Drive IDs) and recurs as memory grows daily.
# SCOPED to (a) the generic-api-key rule ONLY (targetRules) and (b) agent memory/ + claude-dev
# staging .md paths ONLY. Every DEDICATED real-secret rule (anthropic-sk-ant-token, shopify-*,
# jwt, aws, gcp, slack, etc.) stays FULLY ACTIVE in these files — so a real credential VALUE in
# memory or staging STILL blocks the push (the load-bearing "a real secret in memory must fire"
# property holds for every credential type agents actually handle). The fleet scan keeps
# generic-api-key active everywhere for triage visibility. Verified no-regression (planted sk-ant
# in a memory path still caught; generic key OUTSIDE these paths still caught).
[[allowlists]]
description = "generic-api-key entropy FPs in first-party agent memory + claude-dev staging + root-level plan-doc prose"
targetRules = ["generic-api-key"]
paths = [
  '''agents/claude-dev-agent/staging/.*\.md''',
  '''agents/[^/]+/memory/.*\.md''',
  # Root-level plan/dogfood docs whose PROSE trips generic-api-key on the keyword
  # "secret"/"key"/"token" (e.g. a checklist line "no ... secret leak ... remains").
  # 2026-08-20: WINDOWS_DOGFOOD_2_EXECUTION_PLAN.md:259 "secret leak, ..." (upstream
  # docs branch, prose, NOT a credential). generic-api-key ONLY — dedicated rules stay active.
  '''(^|/)WINDOWS_DOGFOOD_2_EXECUTION_PLAN\.md$''',
]

# generic-api-key FPs on Next.js BUILD ARTIFACTS (.next / .next.bak* dirs). Next writes per-build
# preview-mode keys (previewModeSigningKey/EncryptionKey, 64-char) into prerender-manifest.json + high-
# entropy build IDs/hashes into manifests/chunks/.rscinfo/.previewinfo — the default generic-api-key rule
# shape-matches these. BUILD-EPHEMERAL (regenerated every build; a backed-up copy is stale) on an internal
# AUTH-GATED dashboard = not a real credential class. Root cause (2026-08-19): a deploy backup `.next.bak-*`
# was not gitignored, so the analyst daily-snapshot branch captured it into local history — and since this
# pre-push guard runs `gitleaks git .` over ALL local history, that snapshot commit BLOCKED the backup push
# (secret-guard-block 2026-08-20T09:00Z). Durable fix = gitignore `.next.bak*` (applied). This allowlist is
# the MIRROR of the same block added to tools/gitleaks-backup.toml — BOTH-CONFIGS rule: the fleet-scan
# history config and THIS pre-push hook config both scan git history, so an FP baseline must live in both
# (the exact drift that let this block the push: it was baselined in tools/ first, not here). SCOPED to
# generic-api-key ONLY — every DEDICATED real-secret rule (anthropic-sk-ant-token, aws, gcp, slack, shopify,
# jwt) stays ACTIVE in build dirs, so a real cred that somehow landed in one still fires.
[[allowlists]]
description = "generic-api-key FPs on Next.js build artifacts (.next / .next.bak* — ephemeral preview keys + build hashes)"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)\.next(\.bak[^/]*)?/''',
]

# Anthropic sk-ant token (OAuth/API/session) — our runtime + usage creds, spend-capable.
# NOT covered by the gitleaks default ruleset (which only matches sk-ant-api03 if at all,
# not the sk-ant-oat01 OAuth/setup-token format the fleet runs on). Added 2026-06-18 after
# an empirical test proved sk-ant-oat01 was undetected fleet-wide (found 4 real .env.bak leaks).
# Requires 40+ contiguous token chars so truncated "sk-ant-oat01-u...hQAA" placeholders +
# bare "sk-ant" prose in our docs do NOT false-positive.
[[rules]]
id = "anthropic-sk-ant-token"
description = "Anthropic OAuth/API/session token (sk-ant-oat01/api03/sid01), spend-capable"
regex = 'sk-ant-(?:oat01|api03|sid01|sk01)-[A-Za-z0-9_-]{40,}'
keywords = ["sk-ant-"]
