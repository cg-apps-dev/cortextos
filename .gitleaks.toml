title = "cortextOS framework leak-guard config"

[extend]
useDefault = true

[[rules]]
id = "anthropic-sk-ant-token"
description = "Anthropic sk-ant token (any prefix), spend-capable"
regex = '''sk-ant-[a-z0-9]{2,}-[A-Za-z0-9_-]{40,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-svcacct-proj-admin-token"
description = "OpenAI service-account/project/admin key (sk-svcacct/sk-proj/sk-admin), spend-capable"
regex = 'sk-(?:svcacct|proj|admin)-[A-Za-z0-9_-]{40,}'
keywords = ["sk-svcacct-", "sk-proj-", "sk-admin-"]

# pre-push-gitleaks-range regression test synthetic sk-ant fixture (synthetic_secret var,
# sk-ant-test- namespace = NOT a real Anthropic subtype; a planted positive-control for the
# test's detectable-secret cases). Path+rule scoped: a real sk-ant token elsewhere, or any
# other rule on this file, still fires. Rides the feat/pre-push-gitleaks-range branch.
[[allowlists]]
description = "pre-push-gitleaks-range test synthetic sk-ant positive-control fixture"
targetRules = ["anthropic-sk-ant-token"]
paths = ['''tests/pre-push-gitleaks-range\.test\.sh''']

# redactor-parity test fixture (Part B, 2026-10-09): synthetic (non-live) sk-ant + openai token shapes
# consumed by tests/unit/redactor-parity.test.ts. SCOPED to the two dedicated rules ONLY (targetRules)
# + the ONE fixture path ONLY. Real secrets elsewhere, and these rules on any other path, still fire
# (positive-controlled). No JWT entry: gitleaks has no eyJ rule (fixture JWT is redactor-only). Do NOT
# quote the fixture's literal values here (would self-trip at this file's path).
[[allowlists]]
description = "redactor-parity test fixture: synthetic sk-ant + openai shapes (not real secrets), security-agent owned"
targetRules = ["anthropic-sk-ant-token", "openai-svcacct-proj-admin-token"]
paths = [
  '''tests/unit/redactor-parity-corpus\.json$''',
]
